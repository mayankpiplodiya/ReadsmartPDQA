{% extends "base.html" %}
{% block title %}Signup · ReadSmart{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card-soft text-center">
      <h3 class="mb-2">Create an account</h3>
      <p class="small-muted mb-3">Signup (demo: login only accepts admin/admin).</p>

      <form method="POST" action="{{ url_for('signup') }}">
        <div class="mb-3 text-start">
          <label class="form-label">Username</label>
          <input name="username" class="form-control" placeholder="choose a username" required>
        </div>
        <div class="mb-3 text-start">
          <label class="form-label">Password</label>
          <input name="password" type="password" class="form-control" placeholder="choose a password" required>
        </div>

        {% if error %}
          <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}

        <div class="d-grid gap-2">
          <button class="btn btn-success" type="submit">Create Account</button>
        </div>
      </form>

      <p class="mt-3 small-muted mb-0">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
  </div>
</div>
{% endblock %}
